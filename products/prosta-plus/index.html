    }

    $(document).on('click', '#telegram_btn', function(e) {
        e.preventDefault();
        
        var name = $('input[placeholder*="الاسم"], input[name*="name"]').val() || "غير معروف";
        var phone = $('input[placeholder*="الهاتف"], input[name*="phone"]').val();
        var wilaya = $('#custom_wilaya').val();
        
        if (!phone || phone.length < 9 || !wilaya) {
            alert("⚠️ يرجى ملء المعلومات: الهاتف والولاية");
            return;
        }

        var btn = $(this);
        btn.text("جاري الطلب...");

            },
            error: function() {
                alert("❌ خطأ في الاتصال");
                btn.text("أطلب الآن");
            }
        });
